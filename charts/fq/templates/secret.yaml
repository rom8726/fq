{{- $needsNetworkAuth := .Values.config.network.auth.enabled -}}
{{- $needsReplicationAuth := .Values.config.replication.enabled -}}
{{- $hasAnySecretValue := or .Values.auth.secrets.adminToken .Values.auth.secrets.rwToken .Values.auth.secrets.roToken .Values.auth.secrets.replicationToken -}}
{{- if and (not .Values.auth.existingSecret) (or $needsNetworkAuth $needsReplicationAuth (and .Values.auth.createSecret $hasAnySecretValue)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fq.authSecretName" . }}
  labels:
    {{- include "fq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsNetworkAuth }}
  {{ .Values.auth.secretKeys.adminToken | quote }}: {{ required "auth.secrets.adminToken is required when config.network.auth.enabled=true" .Values.auth.secrets.adminToken | quote }}
  {{ .Values.auth.secretKeys.rwToken | quote }}: {{ required "auth.secrets.rwToken is required when config.network.auth.enabled=true" .Values.auth.secrets.rwToken | quote }}
  {{ .Values.auth.secretKeys.roToken | quote }}: {{ required "auth.secrets.roToken is required when config.network.auth.enabled=true" .Values.auth.secrets.roToken | quote }}
  {{- else }}
  {{- with .Values.auth.secrets.adminToken }}
  {{ $.Values.auth.secretKeys.adminToken | quote }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.secrets.rwToken }}
  {{ $.Values.auth.secretKeys.rwToken | quote }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.secrets.roToken }}
  {{ $.Values.auth.secretKeys.roToken | quote }}: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if $needsReplicationAuth }}
  {{ .Values.auth.secretKeys.replicationToken | quote }}: {{ required "auth.secrets.replicationToken is required when config.replication.enabled=true" .Values.auth.secrets.replicationToken | quote }}
  {{- else }}
  {{- with .Values.auth.secrets.replicationToken }}
  {{ $.Values.auth.secretKeys.replicationToken | quote }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
