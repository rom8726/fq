version: 2

project_name: fq

before:
  hooks:
    - go mod tidy

builds:
  - id: fq
    main: ./cmd/fq
    binary: fq
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fq-db/fq/internal/version.Version={{ .Version }}
      - -X github.com/fq-db/fq/internal/version.Commit={{ .FullCommit }}
      - -X github.com/fq-db/fq/internal/version.Date={{ .Date }}

  - id: fq-cli
    main: ./cmd/cli
    binary: fq-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fq-db/fq/internal/version.Version={{ .Version }}
      - -X github.com/fq-db/fq/internal/version.Commit={{ .FullCommit }}
      - -X github.com/fq-db/fq/internal/version.Date={{ .Date }}

  - id: fq-bench
    main: ./cmd/bench
    binary: fq-bench
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fq-db/fq/internal/version.Version={{ .Version }}
      - -X github.com/fq-db/fq/internal/version.Commit={{ .FullCommit }}
      - -X github.com/fq-db/fq/internal/version.Date={{ .Date }}

archives:
  - id: binaries
    ids:
      - fq
      - fq-cli
      - fq-bench
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - config.yml
      - config-slave.yml

nfpms:
  - id: deb
    package_name: fq
    ids:
      - fq
      - fq-cli
    formats:
      - deb
    bindir: /usr/bin
    vendor: fq-db
    homepage: https://github.com/fq-db/fq
    maintainer: fq-db maintainers <maintainers@fq-db.io>
    description: Fast quotas database for rate limiting and quota counters.
    license: MIT
    section: database
    priority: optional
    contents:
      - src: packaging/deb/config.yml
        dst: /etc/fq/config.yml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packaging/systemd/fq.service
        dst: /lib/systemd/system/fq.service
        file_info:
          mode: 0644
      - dst: /var/lib/fq
        type: dir
        file_info:
          mode: 0750
          owner: fq
          group: fq
      - dst: /var/lib/fq/wal
        type: dir
        file_info:
          mode: 0750
          owner: fq
          group: fq
      - dst: /var/lib/fq/certs
        type: dir
        file_info:
          mode: 0750
          owner: fq
          group: fq
    scripts:
      preinstall: packaging/deb/preinstall.sh
      postinstall: packaging/deb/postinstall.sh
      preremove: packaging/deb/preremove.sh
      postremove: packaging/deb/postremove.sh

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers_v2:
  - images:
      - ghcr.io/fq-db/fq
    tags:
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    ids:
      - fq
      - fq-cli
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - config.yml
    labels:
      org.opencontainers.image.title: fq
      org.opencontainers.image.description: Fast quotas database for rate limiting and quota counters
      org.opencontainers.image.source: https://github.com/fq-db/fq
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

release:
  github:
    owner: fq-db
    name: fq
