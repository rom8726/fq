global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fq
    static_configs:
      - targets: ["host.docker.internal:2112"]
        labels:
          role: master
      # Drop this target if you are not running a replica (config-slave.yml).
      - targets: ["host.docker.internal:2113"]
        labels:
          role: replica
