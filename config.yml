network:
  address: ":1945"
  max_connections: 1000
  max_message_size: 4096
  idle_timeout: 10m
persistence:
  mode: wal_and_dump
observability:
  address: ":2112"
wal:
  sync_commit: on
  flushing_batch_length: 4096
  flushing_batch_timeout: 20ms
  queue_capacity: 16384
  max_segment_size: 16MB
  data_directory: ./app/data/wal/
engine:
  type: in_memory
  clean_interval: 5m
dump:
  interval: 5m
  directory: ./app/data/
replication:
  replica_type: master
  master_address: ":1946"
  sync_interval: 1s
logging:
  level: info
