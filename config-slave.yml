network:
  address: ":1947"
  max_connections: 1000
  max_message_size: 4096
  idle_timeout: 10m
persistence:
  mode: wal_and_dump
observability:
  address: ":2113"
wal:
  sync_commit: off
  flushing_batch_length: 4096
  flushing_batch_timeout: 1000ms
  queue_capacity: 16384
  max_segment_size: 16MB
  data_directory: ./app/data-slave/wal/
engine:
  type: in_memory
  clean_interval: 5m
dump:
  interval: 5m
  directory: ./app/data-slave/
replication:
  replica_type: slave
  master_address: ":1946"
  sync_interval: 1s
logging:
  level: debug
